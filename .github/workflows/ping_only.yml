name: Cloud Ping-Only Filter (Fast 2-Round TCP)

on:
  workflow_dispatch:
  push:
    paths:
      - '.trigger_ping'

concurrency:
  group: cloud-prefilter
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ping-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUNBUFFERED: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run Cloud Ping-Only Pre-Filter (2 Rounds)
        run: |
          python cloud_filter/prefilter.py --ping-only
