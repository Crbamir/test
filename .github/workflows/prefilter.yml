name: Cloud Pre-Filter & Auto Tester

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'
  push:
    paths:
      - 'subscriptions.txt'

permissions:
  contents: write

jobs:
  prefilter:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Install Xray-core & Sing-box
        run: |
          # Install Xray-core
          XRAY_VER=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/XTLS/Xray-core/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$XRAY_VER" ]; then XRAY_VER="v25.1.30"; fi
          echo "Installing Xray $XRAY_VER..."
          curl -sL "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip" -o xray.zip
          sudo unzip -q -o xray.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/xray
          rm -f xray.zip
          xray -version

          # Install Sing-box
          SB_VER=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$SB_VER" ]; then SB_VER="v1.11.4"; fi
          SB_VER_CLEAN=$(echo $SB_VER | sed 's/^v//')
          echo "Installing Sing-box $SB_VER..."
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/${SB_VER}/sing-box-${SB_VER_CLEAN}-linux-amd64.tar.gz" -o sb.tar.gz
          tar -xzf sb.tar.gz
          sudo mv sing-box-${SB_VER_CLEAN}-linux-amd64/sing-box /usr/local/bin/sing-box
          sudo chmod +x /usr/local/bin/sing-box
          rm -rf sb.tar.gz sing-box-${SB_VER_CLEAN}-linux-amd64
          sing-box version

      - name: Run Cloud Pre-Filter
        run: |
          python prefilter.py

      - name: Commit and Push Alive Configs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add alive_configs.txt
          if git diff --staged --quiet; then
            echo "No changes in alive_configs.txt"
          else
            git commit -m "Auto-update: fresh alive_configs.txt [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin main
          fi
